<!DOCTYPE html>
<html>
<head>
    <title>My Borrow/Return History</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        h2 {
            color: #2c3e50;
            text-align: center;
        }
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #34495e;
            color: #fff;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .nav {
            text-align: center;
            margin-top: 20px;
        }
        .nav a {
            text-decoration: none;
            padding: 10px 20px;
            margin: 5px;
            background: #3498db;
            color: #fff;
            border-radius: 4px;
        }
        .nav a:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <h2>{{ session['student_name'] }}'s Borrow/Return History</h2>

    <table>
        <tr>
            <th>Book Title</th>
            <th>Action</th>
            <th>Date & Time</th>
        </tr>
        {% for record in history %}
        <tr>
            <td>{{ record['title'] }}</td>
            <td>{{ record['action'] }}</td>
            <td>{{ record['timestamp'] }}</td>
        </tr>
        {% endfor %}
    </table>

    <div class="nav">
        <a href="{{ url_for('chat') }}">Back to Chat</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</body>
</html>
